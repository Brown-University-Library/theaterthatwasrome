[project]
name = "Theater-That-Was-Rome-project"
version = "0.0.0"
description = "Presents early roman texts and images for scholarly study."
readme = "https://github.com/Brown-University-Library/ttwr/blob/main/README.md"
requires-python = ">=3.12.16,<3.13"

dependencies = [
    "bdrxml @ git+https://github.com/Brown-University-Library/bdrxml.git@v2.0.0",
    "django-crispy-forms~=1.11.0",
    "django-dotenv~=1.4.0",
    "django-markdown-deux~=1.0.0",
    "django-pagedown~=2.2.0",
    "django~=5.2.19",
    "httpx2~=2.13.0",
    "lxml~=6.1.3",
    "pillow~=13.0.0",  # dependency of `django-pagedown`
    "requests~=2.34.2",
    "trio~=0.22.0",
]

[dependency-groups]
local = [
    "responses~=0.26.3",
    ]
staging = [ 
    "mysqlclient~=2.2.8",
    "responses~=0.26.3",
    ]
prod = [ 
    "mysqlclient~=2.2.8",
    ]
ci_tests = [ 
    "responses~=0.26.3",
    ]

[tool.uv]
required-version = ">=0.13.6"
constraint-dependencies = [
    "certifi>=2026.10.19",
    "sqlparse>=0.6.1",
    "urllib3>=2.8.0",
]
build-constraint-dependencies = ["setuptools>=84.2.1"]
